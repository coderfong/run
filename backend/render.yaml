# Render blueprint. Push this repo and import via Render → New → Blueprint.
# Render provisions the Postgres DB and injects DATABASE_URL automatically.

services:
  - type: web
    name: territory-run-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: territory-run-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # production enables boot-time config guards (rejects the dev JWT default
      # and a wildcard CORS). The mobile app doesn't use CORS, so the value just
      # needs to be a real origin — the privacy-policy site works.
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://coderfong.github.io"
      - key: APP_VERSION
        value: "2.0.0"
      # In-app purchases. Without these the purchase endpoints hand over the
      # premium pass to anyone who calls them — see app/iap.py. `sync: false`
      # means Render prompts for the value instead of reading it from git, so
      # the secret never lands in the repo.
      - key: IAP_VERIFY_RECEIPTS
        value: "true"
      - key: APPLE_SHARED_SECRET
        sync: false

databases:
  - name: territory-run-db
    plan: starter
    region: singapore
    postgresMajorVersion: 16
    # Render Postgres ships with PostGIS — enable via:
    #   psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS postgis;"
    # Then run schema.sql once.

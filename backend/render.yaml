# Render blueprint. Push this repo and import via Render → New → Blueprint.
# Render provisions the Postgres DB and injects DATABASE_URL automatically.

services:
  - type: web
    name: territory-run-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # NOT WHAT IS RUNNING, as of 2026-08-18. Measured against the live API:
    # the first request after an idle gap takes ~43 SECONDS, and a request
    # touching no database at all (/version) takes ~350ms of server time once
    # warm. Both are the signature of the FREE instance type — free spins the
    # container down when nothing is calling it and boots it again on the next
    # request, and gives the process a fraction of a CPU while it runs.
    # Starter does neither, which is why it is what this file asks for.
    #
    # So this blueprint has either never been applied to the web service or
    # was applied before the instance type was set by hand. Nothing in the
    # application code can fix it: the client-side work done alongside this
    # note (a 60s ceiling on the run-flow calls, and a warm-up ping when the
    # run screen opens) only moves the wait somewhere it does less damage.
    # Sync the blueprint, or set the instance type to Starter in the dashboard.
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: territory-run-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # production enables boot-time config guards (rejects the dev JWT default
      # and a wildcard CORS). The mobile app doesn't use CORS, so the value just
      # needs to be a real origin — the privacy-policy site works.
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://coderfong.github.io"
      - key: APP_VERSION
        value: "2.1.0"
      # In-app purchases. Without these the purchase endpoints hand over the
      # premium pass to anyone who calls them — see app/iap.py. `sync: false`
      # means Render prompts for the value instead of reading it from git, so
      # the secret never lands in the repo.
      - key: IAP_VERIFY_RECEIPTS
        value: "true"
      - key: APPLE_SHARED_SECRET
        sync: false
      # Sign in with Apple: exchange each native authorization code for a
      # refresh token, then revoke it when the user deletes their account.
      - key: APPLE_CLIENT_ID
        value: "com.pacerrun.app"
      - key: APPLE_CLIENT_IDS
        value: "com.pacerrun.app"
      - key: APPLE_TEAM_ID
        value: "D3HU96BTMY"
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # Gate for /admin/*. Unset, those endpoints return 404 and the
      # maintenance surface simply does not exist — which is the safe default,
      # but also means the season recompute cannot be triggered by hand.
      - key: ADMIN_TOKEN
        generateValue: true
      # Who may use the in-app run simulator: comma-separated user ids or
      # usernames, and empty means nobody. See app/devtools.py. It ships dark
      # on purpose — the harness submits runs the server cannot tell from real
      # ones, so this is the line between a testing tool in one tester's build
      # and free territory in everybody's. `sync: false` keeps the list out of
      # git and makes turning it off a dashboard edit rather than a release.
      - key: DEV_RUN_ACCOUNTS
        sync: false

  # Expiry sweep + hold credit. Talks to the database directly (see sweep.py),
  # so it needs no admin token and does not depend on the web service being up.
  #
  # This is NOT optional housekeeping: claims only sweep their own
  # neighbourhood, and this job is the only thing that awards the hold
  # milestone. Without it, expired land lingers everywhere nobody is running
  # and rank stops rewarding keeping ground.
  #
  # Hourly, off the hour: nothing else is scheduled then, and the work is
  # proportional to what has expired since the last pass rather than to the
  # size of the table.
  - type: cron
    name: territory-run-sweep
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    schedule: "17 * * * *"
    dockerCommand: python sweep.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: territory-run-db
          property: connectionString
      - key: ENV
        value: production
      # The sweep never signs anything, but config validation runs at import.
      - key: JWT_SECRET
        fromService:
          name: territory-run-api
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ORIGINS
        value: "https://coderfong.github.io"

  # The seeded world's activity director — see bot_activity.py and
  # docs/BOT_WORLD_DIRECTOR.md. Talks to the database directly, same reasoning
  # as the sweep cron above. Every 15 minutes; BOT_TICK_MINUTES must match the
  # schedule, because per-tick budgets are sized from it.
  #
  # Tuned entirely by BOT_* env vars (bot_sim_config.py documents every one);
  # BOT_ACTIVITY_SCALE=0 turns the simulated world off without a deploy.
  # Before changing a number in production, run `python bot_activity.py
  # --dry-run` from the cron's shell to see what the next tick would do.
  - type: cron
    name: territory-run-bots
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    schedule: "*/15 * * * *"
    dockerCommand: python bot_activity.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: territory-run-db
          property: connectionString
      - key: ENV
        value: production
      - key: JWT_SECRET
        fromService:
          name: territory-run-api
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ORIGINS
        value: "https://coderfong.github.io"

  # Actionable retention reminders. 12:00 UTC is 20:00 in Singapore: late
  # enough that a missing run is meaningful, early enough to save the streak.
  # This job talks to Postgres directly and deduplicates each reminder kind per
  # local day, so a manual retry cannot ring every device twice.
  - type: cron
    name: territory-run-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    schedule: "0 12 * * *"
    dockerCommand: python reminders.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: territory-run-db
          property: connectionString
      - key: ENV
        value: production
      - key: JWT_SECRET
        fromService:
          name: territory-run-api
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ORIGINS
        value: "https://coderfong.github.io"

databases:
  - name: territory-run-db
    plan: starter
    region: singapore
    postgresMajorVersion: 16
    # Render Postgres ships with PostGIS — enable via:
    #   psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS postgis;"
    # Then run schema.sql once.

# Fly.io app config. Replace `app` and the postgres URL.
#
#   fly launch --no-deploy           # create the app + postgres
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)
#   fly secrets set DATABASE_URL=...   # provided by `fly postgres attach`
#   fly secrets set CORS_ORIGINS=*     # tighten for production
#   fly deploy

app = "territory-run-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
